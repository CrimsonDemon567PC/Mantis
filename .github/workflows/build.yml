name: Build Mantis WASM

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install correct wheel version
        run: pip install "wheel<0.41"

      - name: Install pyodide-build
        run: pip install pyodide-build

      - name: Install Emscripten SDK
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install 3.1.46
          ./emsdk activate 3.1.46

          # Source environment in a subshell and export ONLY KEY=VALUE lines
          set -a
          source ./emsdk_env.sh
          set +a

          echo "EMSDK=$EMSDK" >> $GITHUB_ENV
          echo "EM_CONFIG=$EM_CONFIG" >> $GITHUB_ENV
          echo "EM_CACHE=$EM_CACHE" >> $GITHUB_ENV
          echo "BINARYEN_ROOT=$BINARYEN_ROOT" >> $GITHUB_ENV
          echo "LLVM_ROOT=$LLVM_ROOT" >> $GITHUB_ENV
          echo "EMSDK_NODE=$EMSDK_NODE" >> $GITHUB_ENV
          echo "EMSDK_PYTHON=$EMSDK_PYTHON" >> $GITHUB_ENV
          echo "PATH=$PATH" >> $GITHUB_ENV

      - name: Verify Emscripten
        run: |
          echo "PATH is: $PATH"
          which emcc
          which wasm-opt
          emcc --version

      - name: Build Pyodide package
        run: pyodide build

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mantis-wasm
          path: dist/
          retention-days: 7
