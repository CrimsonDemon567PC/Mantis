name: Build Mantis WASM

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install correct wheel version
        run: pip install "wheel<0.41"

      - name: Install pyodide-build
        run: pip install pyodide-build

      - name: Install Emscripten SDK
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install 3.1.46
          ./emsdk activate 3.1.46

          # Source emsdk_env.sh in a subshell and export all variables
          {
            echo "Extracting Emscripten environment"
            source ./emsdk_env.sh

            echo "EMSDK=$EMSDK"
            echo "EM_CONFIG=$EM_CONFIG"
            echo "EM_CACHE=$EM_CACHE"
            echo "BINARYEN_ROOT=$BINARYEN_ROOT"
            echo "LLVM_ROOT=$LLVM_ROOT"
            echo "EMSDK_NODE=$EMSDK_NODE"
            echo "EMSDK_PYTHON=$EMSDK_PYTHON"
            echo "PATH=$PATH"
          } >> $GITHUB_ENV

      - name: Verify Emscripten
        run: |
          echo "PATH is: $PATH"
          which emcc
          which wasm-opt
          emcc --version

      - name: Build Pyodide package
        run: pyodide build

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mantis-wasm
          path: dist/
          retention-days: 7
