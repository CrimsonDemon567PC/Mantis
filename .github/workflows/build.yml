name: Build Mantis WASM

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    defaults:
      run:
        working-directory: mantis-wasm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install "wheel<0.41" pyodide-build

      # -----------------------------
      # Ensure pyproject.toml exists
      # -----------------------------
      - name: Verify project structure
        run: |
          set -euo pipefail

          if [[ ! -f pyproject.toml ]]; then
            echo "pyproject.toml missing in mantis-wasm/" >&2
            exit 1
          fi

          if [[ ! -d mantis ]]; then
            echo "mantis package directory missing." >&2
            exit 1
          fi

      # -----------------------------
      # Cache emsdk
      # -----------------------------
      - name: Cache emsdk
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-3.1.46

      # -----------------------------
      # Install Emscripten
      # -----------------------------
      - name: Install Emscripten SDK
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d emsdk ]]; then
            git clone https://github.com/emscripten-core/emsdk.git
          fi

          cd emsdk
          ./emsdk install 3.1.46
          ./emsdk activate 3.1.46

          EMSDK_PATH="$PWD"

          echo "EMSDK=$EMSDK_PATH" >> "$GITHUB_ENV"
          echo "PATH=$EMSDK_PATH/upstream/bin:$EMSDK_PATH/upstream/emscripten:${PATH}" >> "$GITHUB_ENV"

      # -----------------------------
      # Verify toolchain
      # -----------------------------
      - name: Verify Emscripten
        run: |
          set -euo pipefail
          command -v emcc
          command -v wasm-opt
          emcc --version
          wasm-opt --version

      # -----------------------------
      # Build Pyodide package
      # -----------------------------
      - name: Build Pyodide package
        run: |
          set -euo pipefail
          pyodide build .

      # -----------------------------
      # Debug dist
      # -----------------------------
      - name: Show dist
        if: always()
        run: |
          echo "=== dist ==="
          ls -la dist || echo "dist not found"

      # -----------------------------
      # Upload artifact
      # -----------------------------
      - name: Upload WASM artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mantis-wasm
          path: mantis-wasm/dist/
          retention-days: 7
