name: Build Mantis WASM

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure pip and setuptools are up to date
        run: python -m pip install --upgrade pip setuptools

      - name: Pin wheel to compatible version
        run: pip install "wheel<0.41"

      - name: Install pyodide-build
        run: pip install pyodide-build

      - name: Install Emscripten SDK (emsdk 3.1.46)
        run: |
          set -euo pipefail

          # Clone and install the requested emsdk release
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install 3.1.46
          ./emsdk activate 3.1.46

          # Source emsdk_env.sh in a safe way:
          # - temporarily disable nounset so sourcing won't fail if some vars are absent
          # - then export only KEY=VALUE lines into $GITHUB_ENV (no free text)
          set +u
          source ./emsdk_env.sh
          set -u

          # Write required variables into GitHub Actions environment (KEY=VALUE only).
          # Use parameter expansion with defaults to avoid unbound variable errors.
          echo "EMSDK=${EMSDK:-}" >> $GITHUB_ENV
          echo "EM_CONFIG=${EM_CONFIG:-}" >> $GITHUB_ENV
          echo "EM_CACHE=${EM_CACHE:-}" >> $GITHUB_ENV
          echo "BINARYEN_ROOT=${BINARYEN_ROOT:-}" >> $GITHUB_ENV
          echo "LLVM_ROOT=${LLVM_ROOT:-}" >> $GITHUB_ENV
          echo "EMSDK_NODE=${EMSDK_NODE:-}" >> $GITHUB_ENV
          echo "EMSDK_PYTHON=${EMSDK_PYTHON:-}" >> $GITHUB_ENV

          # CRITICAL: ensure both Binaryen and Emscripten directories are first in PATH
          # Use absolute EMSDK path to avoid ambiguity
          echo "PATH=${EMSDK:-}/upstream/bin:${EMSDK:-}/upstream/emscripten:$PATH" >> $GITHUB_ENV

      - name: Verify Emscripten and Binaryen are available
        run: |
          set -euo pipefail
          echo "PATH: $PATH"
          if ! command -v emcc >/dev/null 2>&1; then
            echo "emcc not found in PATH"
            exit 1
          fi
          if ! command -v wasm-opt >/dev/null 2>&1; then
            echo "wasm-opt (Binaryen) not found in PATH"
            exit 1
          fi
          emcc --version
          wasm-opt --version

      - name: Build Pyodide package
        env:
          # ensure pyodide-build sees the same PATH in this step
          PATH: ${{ env.PATH }}
        run: |
          set -euo pipefail
          # show pyodide CLI version for debugging (optional)
          pyodide --version || true
          pyodide build

      - name: List dist directory for debugging
        if: always()
        run: |
          echo "dist contents:"
          ls -la dist || echo "dist not present"

      - name: Upload WASM artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mantis-wasm
          path: dist/
          retention-days: 7
