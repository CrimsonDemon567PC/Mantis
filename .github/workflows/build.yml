name: Build Mantis WASM (robust)

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    outputs:
      smoke_ok: ${{ steps.check.outputs.ok }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Quick environment check
        id: check
        run: |
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "Runner: $(uname -a)"
          echo "ok=true" >> "$GITHUB_OUTPUT"

  build:
    name: Install Emscripten and Build Pyodide
    runs-on: ubuntu-latest
    needs: smoke
    if: needs.smoke.outputs.smoke_ok == 'true'
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip tooling
        run: |
          python -m pip install --upgrade pip setuptools
          pip install "wheel<0.41"

      - name: Install pyodide-build
        run: pip install pyodide-build

      - name: Ensure Python project metadata exists
        id: ensure_pyproject
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f pyproject.toml || -f setup.py ]]; then
            echo "project_file=exists" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -d mantis ]]; then
            cat > pyproject.toml <<'PYPROJECT'
[project]
name = "mantis"
version = "0.0.0"
description = "Temporary pyproject for CI pyodide build"
authors = [{ name = "CI" }]

[tool.pyodide]
packages = ["mantis"]
PYPROJECT
            echo "project_file=created" >> "$GITHUB_OUTPUT"
          else
            echo "No pyproject.toml/setup.py and no mantis/ directory found." >&2
            exit 1
          fi

      # Cache emsdk to speed up builds
      - name: Cache emsdk
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-3.1.46

      - name: Install Emscripten SDK
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d emsdk ]]; then
            git clone https://github.com/emscripten-core/emsdk.git
          fi

          cd emsdk
          ./emsdk install 3.1.46
          ./emsdk activate 3.1.46

          # Persist environment for next steps
          echo "EMSDK=$PWD" >> "$GITHUB_ENV"
          echo "PATH=$PWD/upstream/bin:$PWD/upstream/emscripten:$PATH" >> "$GITHUB_ENV"

      - name: Verify Emscripten
        shell: bash
        run: |
          set -euo pipefail
          command -v emcc
          command -v wasm-opt
          emcc --version
          wasm-opt --version

      - name: Build Pyodide package
        shell: bash
        run: |
          set -euo pipefail
          pyodide --version || true
          pyodide build .

      - name: Show dist contents
        if: always()
        run: |
          echo "=== dist directory ==="
          ls -la dist || echo "dist not present"

      - name: Upload WASM artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mantis-wasm
          path: dist/
          retention-days: 7
