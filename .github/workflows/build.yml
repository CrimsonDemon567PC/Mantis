name: Build Mantis WASM

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # -----------------------------
      # Checkout
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # Python
      # -----------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip tooling
        run: |
          python -m pip install --upgrade pip setuptools
          pip install "wheel<0.41"

      - name: Install pyodide-build
        run: pip install pyodide-build

      # -----------------------------
      # Ensure project metadata
      # -----------------------------
      - name: Ensure pyproject.toml exists
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f pyproject.toml || -f setup.py ]]; then
            echo "Project metadata found."
            exit 0
          fi

          if [[ -d mantis ]]; then
            cat > pyproject.toml <<'PYPROJECT'
[project]
name = "mantis"
version = "0.0.0"
description = "Temporary CI pyproject"
authors = [{ name = "CI" }]

[tool.pyodide]
packages = ["mantis"]
PYPROJECT
          else
            echo "No Python project metadata or mantis/ directory found." >&2
            exit 1
          fi

      # -----------------------------
      # Cache emsdk
      # -----------------------------
      - name: Cache emsdk
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-3.1.46

      # -----------------------------
      # Install Emscripten
      # -----------------------------
      - name: Install Emscripten SDK
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d emsdk ]]; then
            git clone https://github.com/emscripten-core/emsdk.git
          fi

          cd emsdk
          ./emsdk install 3.1.46
          ./emsdk activate 3.1.46

          EMSDK_PATH="$PWD"

          echo "EMSDK=$EMSDK_PATH" >> "$GITHUB_ENV"
          echo "PATH=$EMSDK_PATH/upstream/bin:$EMSDK_PATH/upstream/emscripten:${PATH}" >> "$GITHUB_ENV"

      # -----------------------------
      # Verify toolchain
      # -----------------------------
      - name: Verify Emscripten
        shell: bash
        run: |
          set -euo pipefail
          command -v emcc
          command -v wasm-opt
          emcc --version
          wasm-opt --version

      # -----------------------------
      # Build Pyodide package
      # -----------------------------
      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          pyodide --version || true
          pyodide build .

      # -----------------------------
      # Debug dist
      # -----------------------------
      - name: Show dist directory
        if: always()
        run: |
          echo "=== dist ==="
          ls -la dist || echo "dist not found"

      # -----------------------------
      # Upload artifact
      # -----------------------------
      - name: Upload WASM artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mantis-wasm
          path: dist/
          retention-days: 7
