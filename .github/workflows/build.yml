name: Build Mantis WASM (robust)

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    outputs:
      smoke_ok: ${{ steps.check.outputs.ok }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Quick environment check
        id: check
        run: |
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "Runner: $(uname -a)"
          echo "ok=true" >> $GITHUB_OUTPUT

  build:
    name: Install Emscripten and Build Pyodide
    runs-on: ubuntu-latest
    needs: smoke
    if: needs.smoke.outputs.smoke_ok == 'true'
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure pip and setuptools are up to date
        run: python -m pip install --upgrade pip setuptools

      - name: Pin wheel to compatible version
        run: pip install "wheel<0.41"

      - name: Install pyodide-build
        run: pip install pyodide-build

      - name: Ensure Python project metadata exists (create minimal pyproject.toml if missing)
        id: ensure_pyproject
        run: |
          set -euo pipefail
          if [ -f pyproject.toml ] || [ -f setup.py ]; then
            echo "project_file=exists" >> $GITHUB_OUTPUT
          else
            if [ -d "mantis" ]; then
              cat > pyproject.toml <<'PYPROJECT'
[project]
name = "mantis"
version = "0.0.0"
description = "Temporary pyproject for CI pyodide build"
authors = [{ name = "CI" }]
[tool.pyodide]
packages = ["mantis"]
PYPROJECT
              echo "project_file=created" >> $GITHUB_OUTPUT
            else
              echo "No pyproject.toml or setup.py and no mantis/ directory found. Aborting." >&2
              exit 1
            fi
          fi

      - name: Install Emscripten SDK (emsdk 3.1.46)
        run: |
          set -euo pipefail
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install 3.1.46
          ./emsdk activate 3.1.46

          # Source emsdk_env.sh in a safe way (allow missing vars during source)
          set +u
          source ./emsdk_env.sh
          set -u

          # Export required variables into GitHub Actions environment (KEY=VALUE only).
          echo "EMSDK=${EMSDK:-}" >> $GITHUB_ENV
          echo "EM_CONFIG=${EM_CONFIG:-}" >> $GITHUB_ENV
          echo "EM_CACHE=${EM_CACHE:-}" >> $GITHUB_ENV
          echo "BINARYEN_ROOT=${BINARYEN_ROOT:-}" >> $GITHUB_ENV
          echo "LLVM_ROOT=${LLVM_ROOT:-}" >> $GITHUB_ENV
          echo "EMSDK_NODE=${EMSDK_NODE:-}" >> $GITHUB_ENV
          echo "EMSDK_PYTHON=${EMSDK_PYTHON:-}" >> $GITHUB_ENV

          # Ensure both Binaryen and Emscripten directories are first in PATH
          echo "PATH=${EMSDK:-}/upstream/bin:${EMSDK:-}/upstream/emscripten:$PATH" >> $GITHUB_ENV

      - name: Verify Emscripten and Binaryen are available
        run: |
          set -euo pipefail
          echo "PATH: $PATH"
          if ! command -v emcc >/dev/null 2>&1; then
            echo "emcc not found in PATH" >&2
            exit 1
          fi
          if ! command -v wasm-opt >/dev/null 2>&1; then
            echo "wasm-opt (Binaryen) not found in PATH" >&2
            exit 1
          fi
          emcc --version
          wasm-opt --version

      - name: Build Pyodide package
        env:
          PATH: ${{ env.PATH }}
        run: |
          set -euo pipefail
          pyodide --version || true
          pyodide build

      - name: Show dist contents (debug)
        if: always()
        run: |
          echo "=== dist directory ==="
          ls -la dist || echo "dist not present"

      - name: Upload WASM artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mantis-wasm
          path: dist/
          retention-days: 7
